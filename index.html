
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ZUNORO</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
}

#opening {
    width: 100%;
    height: 100%;
    background: #000000;

    display: flex;
    justify-content: center;
    align-items: center;
}

.loader {
    width: 55px;
    height: 55px;

    border: 4px solid #222222;
    border-top: 4px solid #FFD700;

    border-radius: 50%;

    animation: rotate 0.8s linear infinite;
}

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

</style>
</head>

<body>

<div id="opening">

    <div class="loader"></div>

</div>

</body>
</html>
